<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporting Mensual — Dynamic Branding · Junio 2026</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--bg2:#F6F6F5;--bg3:#EEEEEC;--line:#E0E0DE;--line2:#EBEBEA;
  --t1:#121211;--t2:#2E2E2C;--mu:#777774;--mu2:#A5A5A2;
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-bd:#FAC775;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-bd:#9FE1CB;
  --purple:#534AB7;--purp-bg:#EEEDFE;--purp-bd:#CECBF6;
  --coral:#993C1D;--coral-bg:#FAECE7;--coral-bd:#F5C4B3;
  --font:-apple-system,'Inter','Helvetica Neue',sans-serif;
}
body{font-family:var(--font);background:var(--bg2);color:var(--t1);font-size:14px;line-height:1.5}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);padding:0 40px;display:flex;align-items:center;height:52px;gap:0}
.nav-brand{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--t1);margin-right:32px;white-space:nowrap}
.nav-links{display:flex;gap:0;list-style:none;height:100%}
.nav-links a{display:flex;align-items:center;height:52px;padding:0 16px;font-size:12px;color:var(--mu);text-decoration:none;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
.nav-links a:hover{color:var(--t1)}
.nav-links a.active{color:var(--t1);border-bottom-color:var(--amber)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.nav-date{font-size:12px;color:var(--mu2)}
.btn-edit{background:var(--t1);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .15s}
.btn-edit:hover{opacity:.8}

/* MAIN */
main{max-width:1400px;margin:0 auto;padding:40px 40px 80px;display:flex;flex-direction:column;gap:32px}

/* SECTION */
.section{background:var(--bg);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.section-header{padding:28px 32px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:baseline;gap:12px}
.section-num{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--mu2);text-transform:uppercase}
.section-title{font-size:22px;font-weight:600;color:var(--t1);flex:1}
.section-sub{font-size:13px;color:var(--mu)}
.section-body{padding:24px 32px}
.section-accent-amber{border-top:3px solid var(--amber)}
.section-accent-teal{border-top:3px solid var(--teal)}
.section-accent-purple{border-top:3px solid var(--purple)}
.section-accent-coral{border-top:3px solid var(--coral)}

/* COVER */
.cover{background:var(--t1);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:340px 1fr;min-height:280px}
.cover-left{background:#0A0A09;padding:40px 36px;border-right:1px solid #2A2A28;display:flex;flex-direction:column;justify-content:space-between}
.cover-eyebrow{font-size:10px;font-weight:500;letter-spacing:.12em;color:#555;text-transform:uppercase}
.cover-title{font-size:48px;font-weight:700;color:#F5F5F0;line-height:1.0;margin-top:16px}
.cover-month{font-size:22px;color:var(--amber-bd);margin-top:20px}
.cover-divider{width:40px;height:2px;background:var(--amber-bd);margin:16px 0}
.cover-vertical{font-size:14px;color:#555}
.cover-right{padding:40px}
.cover-index-label{font-size:10px;font-weight:500;letter-spacing:.1em;color:#555;text-transform:uppercase;margin-bottom:16px}
.cover-index-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.cover-index-list li{display:flex;align-items:center;gap:10px;font-size:18px;color:#888}
.cover-index-list li.active{color:#E8E8E0}
.cover-dot{width:6px;height:6px;border-radius:50%;background:#333;flex-shrink:0}
.cover-dot.active{background:var(--amber-bd)}
.cover-footer{font-size:12px;color:#444;margin-top:auto;padding-top:24px}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid}
.badge-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-meeting{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.badge-meeting .badge-dot{background:var(--amber)}
.badge-curso{background:var(--teal-bg);color:var(--teal);border-color:var(--teal-bd)}
.badge-curso .badge-dot{background:var(--teal)}
.badge-empezar{background:var(--purp-bg);color:var(--purple);border-color:var(--purp-bd)}
.badge-empezar .badge-dot{background:var(--purple)}
.badge-terminado{background:var(--bg2);color:var(--mu);border-color:var(--line)}
.badge-terminado .badge-dot{background:var(--mu2)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--bg2)}
thead th{text-align:left;padding:10px 14px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--line2)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
tbody td{padding:12px 14px;vertical-align:middle}
.td-project{font-weight:500;color:var(--t1)}
.td-client{color:var(--mu)}
.td-next{color:var(--mu)}
.td-next.meeting{color:var(--amber);font-weight:500}
.td-fecha{color:var(--mu2);font-size:12px;white-space:nowrap}
.td-fecha.urgent{color:var(--coral);font-weight:600}

/* BILLING */
.billing-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.billing-card{background:var(--bg2);border-radius:8px;padding:28px;border-left:3px solid var(--line)}
.billing-card.filled{border-left-color:var(--amber)}
.billing-label{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}
.billing-sub{font-size:13px;color:var(--mu2);margin-top:4px}
.billing-divider{width:100%;height:1px;background:var(--line2);margin:16px 0}
.billing-value{font-size:48px;font-weight:700;color:var(--amber);line-height:1}
.billing-value.empty{color:var(--mu2)}
.billing-note{font-size:12px;color:var(--mu2);margin-top:12px}
.billing-alert{background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:6px;padding:12px 16px;font-size:13px;color:var(--amber);margin-top:20px}

/* CHART */
.chart-labels-top{display:flex;justify-content:space-between;font-size:11px;color:var(--mu2);margin-bottom:8px;padding:0 4px}
.chart-container{position:relative;width:100%;height:360px}
.chart-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.chart-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2)}
.strip-label{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--mu2);text-transform:uppercase}
.strip-value{font-size:15px;font-weight:600;color:var(--amber);margin-top:4px}
.strip-value.muted{color:var(--mu)}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi-card{background:var(--bg2);border-radius:8px;padding:24px;border-top:3px solid;display:flex;flex-direction:column}
.kpi-card-amber{border-top-color:var(--amber)}
.kpi-card-teal{border-top-color:var(--teal)}
.kpi-card-purple{border-top-color:var(--purple)}
.kpi-num{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--mu2);text-transform:uppercase;margin-bottom:10px}
.kpi-name{font-size:18px;font-weight:600;color:var(--t1);line-height:1.2;margin-bottom:16px}
.kpi-divider{height:1px;background:var(--line);margin:0 0 16px}
.kpi-value{font-size:42px;font-weight:700;line-height:1;margin-bottom:4px}
.kpi-value-amber{color:var(--amber)}
.kpi-value-teal{color:var(--teal)}
.kpi-value-purple{color:var(--purple)}
.kpi-value-empty{color:var(--mu2)}
.kpi-note{font-size:12px;color:var(--mu2);margin-bottom:16px}
.kpi-divider2{height:1px;background:var(--line2);margin:0 0 12px}
.kpi-vs-label{font-size:11px;color:var(--mu2)}
.kpi-vs{font-size:16px;font-weight:600;margin-top:2px;margin-bottom:16px}
.kpi-vs-up{color:var(--teal)}
.kpi-vs-down{color:var(--coral)}
.kpi-vs-muted{color:var(--mu2)}
.kpi-def-label{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--mu2);text-transform:uppercase}
.kpi-def{font-size:12px;color:var(--mu);margin-top:4px;line-height:1.5;margin-bottom:16px}
.kpi-obj{font-size:11px;font-weight:500;margin-top:auto;padding-top:8px;border-top:1px solid var(--line2)}
.kpi-obj-amber{color:var(--amber)}
.kpi-obj-teal{color:var(--teal)}
.kpi-obj-purple{color:var(--purple)}

/* PROBLEMS */
.problems-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.problem-card{background:var(--bg2);border-radius:8px;border-top:3px solid var(--coral);padding:18px;display:flex;flex-direction:column}
.problem-num{font-size:11px;font-weight:600;color:var(--coral);margin-bottom:4px}
.problem-title{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:10px;line-height:1.3}
.problem-divider{height:1px;background:var(--line);margin:0 0 10px}
.problem-text-label{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--mu2);text-transform:uppercase;margin-bottom:4px}
.problem-text{font-size:12px;color:var(--mu);line-height:1.55;margin-bottom:12px}
.problem-mejora-badge{display:inline-block;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-bd);border-radius:12px;font-size:10px;font-weight:500;padding:2px 10px;margin-bottom:6px}
.problem-mejora{font-size:12px;color:var(--t2);line-height:1.55}

/* LEGEND ROW */
.legend-row{display:flex;gap:20px;padding:16px 32px;border-top:1px solid var(--line2);background:var(--bg2)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* FOOTER */
footer{text-align:center;font-size:12px;color:var(--mu2);padding:32px 0 0;border-top:1px solid var(--line)}

/* ── EDITOR PANEL ── */
.editor-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;backdrop-filter:blur(2px)}
.editor-overlay.open{display:flex;align-items:flex-start;justify-content:flex-end}
.editor-panel{background:var(--bg);width:680px;height:100vh;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.15);display:flex;flex-direction:column}
.editor-header{padding:24px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10}
.editor-header h2{font-size:16px;font-weight:600}
.editor-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--mu);padding:4px 8px;border-radius:4px}
.editor-close:hover{background:var(--bg2)}
.editor-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 28px;background:var(--bg);position:sticky;top:73px;z-index:10}
.editor-tab{padding:12px 16px;font-size:12px;font-weight:500;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.editor-tab.active{color:var(--t1);border-bottom-color:var(--amber)}
.editor-body{padding:24px 28px;flex:1}
.editor-section{display:none}
.editor-section.active{display:block}

/* EDITOR FORM ELEMENTS */
.editor-row{margin-bottom:20px;background:var(--bg2);border-radius:8px;padding:16px;border:1px solid var(--line2);position:relative}
.editor-row-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.editor-row-title{font-size:12px;font-weight:600;color:var(--t1)}
.btn-delete-row{background:none;border:none;color:var(--mu2);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.btn-delete-row:hover{background:var(--coral-bg);color:var(--coral)}
.field-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.field-group.full{grid-template-columns:1fr}
label{display:block;font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--mu2);text-transform:uppercase;margin-bottom:4px}
input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:var(--font);color:var(--t1);background:var(--bg);transition:border-color .15s}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.btn-add-row{width:100%;padding:10px;border:1.5px dashed var(--line);border-radius:8px;background:none;color:var(--mu);font-size:13px;cursor:pointer;margin-top:8px;transition:all .15s}
.btn-add-row:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}

/* EDITOR FOOTER */
.editor-footer{padding:20px 28px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);display:flex;gap:10px;align-items:center}
.btn-publish{flex:1;background:var(--t1);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-publish:hover{opacity:.8}
.btn-publish:disabled{opacity:.4;cursor:not-allowed}
.publish-status{font-size:12px;color:var(--mu)}
.publish-status.success{color:var(--teal)}
.publish-status.error{color:var(--coral)}
</style>
</head>

    </div>
    <div class="editor-footer">
      <button class="btn-publish" onclick="publishToGithub()" id="btn-publish">Publicar en GitHub</button>
      <span class="publish-status" id="publish-status"></span>
    </div>
  </div>
</div>

function badgeHTML(estado) {
  const map = {
    meeting: ['badge-meeting','Reunión'],
    curso:   ['badge-curso','En curso'],
    empezar: ['badge-empezar','Por empezar'],
    terminado:['badge-terminado','Terminado'],
    standby: ['badge-terminado','Stand by'],
    ajuste:  ['badge-empezar','Ronda de ajuste'],
  };
  const [cls, label] = map[estado] || ['badge-terminado', estado];
  return `<span class="badge ${cls}"><span class="badge-dot"></span>${label}</span>`;
}

function prioHTML(p) {
  const map = {
    alta:  ['var(--coral-bg)','var(--coral)','var(--coral-bd)','Alta'],
    media: ['var(--amber-bg)','var(--amber)','var(--amber-bd)','Media'],
    baja:  ['var(--bg2)','var(--mu)','var(--line)','Baja'],
  };
  const [bg,fg,bd,label] = map[p] || map.baja;
  return `<span class="badge" style="background:${bg};color:${fg};border-color:${bd}">${label}</span>`;
}

function initCharts() {
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const FM = 5;
  const pending220 = Array(12).fill(null).map((_,i)=>i>=FM?220000:null);
  const pending30  = Array(12).fill(null).map((_,i)=>i>=FM?30000:null);

  const pluginTotals = {
    id:'totals',
    afterDatasetsDraw(chart){
      const {ctx}=chart;
      const totals=[126180,108744,133308,161583,193503];
      ctx.save();ctx.font='600 11px sans-serif';ctx.fillStyle='#444';ctx.textAlign='center';ctx.textBaseline='bottom';
      const meta=chart.getDatasetMeta(chart.data.datasets.findIndex(d=>d.label==='Social Media'));
      meta.data.forEach((bar,i)=>{if(i<FM)ctx.fillText(Math.round(totals[i]/1000)+'k',bar.x,bar.y-4);});
      ctx.restore();
    }
  };
  const pluginSeg = {
    id:'seg',
    afterDatasetsDraw(chart){
      const {ctx}=chart;ctx.save();ctx.font='600 10px sans-serif';ctx.fillStyle='rgba(255,255,255,.92)';ctx.textAlign='center';ctx.textBaseline='middle';
      chart.data.datasets.forEach((ds,di)=>{
        if(ds.label==='Pendiente')return;
        const meta=chart.getDatasetMeta(di);
        meta.data.forEach((bar,i)=>{
          if(i>=FM)return;const val=ds.data[i];if(!val||val<8000)return;
          const bh=bar.height;if(bh<22)return;
          ctx.fillText(Math.round(val/1000)+'k',bar.x,bar.y+bh/2);
        });
      });ctx.restore();
    }
  };

  if(window._chartAgencia){window._chartAgencia.destroy();}
  window._chartAgencia = new Chart(document.getElementById('chartAgencia'),{
    type:'bar', plugins:[pluginTotals,pluginSeg],
    data:{labels:months,datasets:[
      {label:'Dynamic Branding',data:[24170,10889,20132,14172,25467,null,null,null,null,null,null,null],backgroundColor:'#1F7D38',stack:'s'},
      {label:'Iconic Packaging', data:[22490,35017,17921,24380,76945,null,null,null,null,null,null,null],backgroundColor:'#34C7A1',stack:'s'},
      {label:'Creative Content', data:[64914,53792,75582,109554,77814,null,null,null,null,null,null,null],backgroundColor:'#D43470',stack:'s'},
      {label:'Digital Product',  data:[10057, 8297,18923,11376, 9726,null,null,null,null,null,null,null],backgroundColor:'#188FAF',stack:'s'},
      {label:'Social Media',     data:[ 4550,  750,  750, 2100, 3550,null,null,null,null,null,null,null],backgroundColor:'#9FD9CC',stack:'s'},
      {label:'Pendiente',        data:pending220,backgroundColor:'#E8E6DF',stack:'s'},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label(ctx){if(ctx.dataset.label==='Pendiente')return null;const v=ctx.raw;return v?ctx.dataset.label+': '+v.toLocaleString('es-ES')+' €':null;}}}},scales:{x:{grid:{display:false},ticks:{autoSkip:false,maxRotation:0}},y:{max:230000,ticks:{callback:v=>Math.round(v/1000)+'k €'},grid:{color:'rgba(0,0,0,.05)'}}}}
  });

  if(window._chartDB){window._chartDB.destroy();}
  window._chartDB = new Chart(document.getElementById('chartDB'),{
    type:'bar',
    data:{labels:months,datasets:[
      {label:'Dynamic Branding',data:[24170,10889,20132,14172,25467,null,null,null,null,null,null,null],backgroundColor:'#FAC775',borderRadius:3,stack:'s'},
      {label:'Pendiente',data:pending30,backgroundColor:'#E8E6DF',borderRadius:3,stack:'s'},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label(ctx){if(ctx.dataset.label==='Pendiente')return null;const v=ctx.raw;return v?v.toLocaleString('es-ES')+' €':null;}}}},scales:{x:{grid:{display:false},ticks:{autoSkip:false,maxRotation:0}},y:{max:32000,ticks:{callback:v=>Math.round(v/1000)+'k €'},grid:{color:'rgba(0,0,0,.05)'}}}}
  });
}

function initNavObserver(){
  const sections=document.querySelectorAll('section[id]');
  const links=document.querySelectorAll('.nav-links a');
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id));});},{threshold:.3});
  sections.forEach(s=>obs.observe(s));
}

// ══════════════════════════════════════════════════════
// PUBLISH TO GITHUB
// ══════════════════════════════════════════════════════
async function publishToGithub(){
  applyEditorChanges();
  render();

  const btn = document.getElementById('btn-publish');
  const status = document.getElementById('publish-status');
  btn.disabled = true;
  btn.textContent = 'Publicando...';
  status.textContent = '';
  status.className = 'publish-status';

  try {
    // Get current SHA
    const getRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
      headers:{ Authorization: `token ${GITHUB_TOKEN}` }
    });
    const getJson = await getRes.json();
    const sha = getJson.sha;

    // Get current HTML and update data block
    const currentHTML = document.documentElement.outerHTML;
    const newDataBlock = `let data = ${JSON.stringify(data, null, 2)};`;
    const updatedHTML = currentHTML.replace(/let data = \{[\s\S]*?
\};/, newDataBlock);

    const encoded = btoa(unescape(encodeURIComponent(updatedHTML)));

    const putRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
      method: 'PUT',
      headers:{ Authorization: `token ${GITHUB_TOKEN}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ message: `Reporting update ${new Date().toLocaleDateString('es-ES')}`, content: encoded, sha })
    });

    if(putRes.ok){
      status.textContent = '✓ Publicado correctamente';
      status.className = 'publish-status success';
    } else {
      throw new Error('GitHub error: ' + putRes.status);
    }
  } catch(err){
    status.textContent = '✕ Error: ' + err.message;
    status.className = 'publish-status error';
  }

  btn.disabled = false;
  btn.textContent = 'Publicar en GitHub';
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
render();
</script>
